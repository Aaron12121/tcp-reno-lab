<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">

<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#F3F6FB">
<title>TCP Reno 快速恢复 · 动态模型</title>
<style>
:root{--page:#f3f6fb;--ink:#172033;--muted:#64748b;--line:#dce4ef;--blue:#2563eb;--blueD:#1746ad;--red:#dc3545;--redD:#a91627;--acc:var(--blue)}
.mode-without{--acc:var(--red)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(circle at 50% -20%,#e6eefc,transparent 46rem),var(--page);color:var(--ink);
  font-family:"Segoe UI","Microsoft YaHei UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB","Noto Sans SC","HarmonyOS Sans SC","MiSans",sans-serif;-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:manipulation;-webkit-user-select:none;user-select:none}
#app{position:fixed;left:0;top:0;right:0;bottom:0;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#stage{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;padding:12px 12px 6px}
canvas{display:block;border-radius:14px}
#bar{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;padding:4px 12px 12px}
.prog{display:flex;gap:4px;width:100%;max-width:560px;margin:0 auto 8px}
.prog i{flex:1;height:6px;border-radius:3px;background:#d3dceb;cursor:pointer;transition:background .2s}
.prog i.done{background:#a9c0ec}.mode-without .prog i.done{background:#efb1b8}
.prog i.on{background:var(--acc)}
.btns{display:flex;gap:10px;width:100%;max-width:560px}
button{flex:1;font:inherit;font-size:16px;min-height:44px;padding:6px 10px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;box-shadow:0 3px 10px rgba(33,64,112,.06);transition:transform .12s,border-color .12s}
button:active{transform:scale(.97)}
button:disabled{opacity:.38}
button.primary{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
button svg{width:18px;height:18px;flex:0 0 auto}
@media (hover:hover){button:hover:not(:disabled){border-color:#aebcd0}}
/* 横版：操作栏一行，进度条在按钮右侧 */
.land #bar{flex-direction:row;justify-content:center;gap:14px;padding:2px 16px 14px}
.land .btns{width:auto;max-width:none}
.land button{flex:0 0 auto;min-width:104px}
.land .prog{width:260px;margin:0}
/* 手机横屏：按钮竖排在右侧，只显示图标，把高度全部留给画面 */
#app.compact{flex-direction:row}
.compact #stage{padding:6px 4px 6px 8px}
.compact #bar{flex-direction:column;justify-content:center;width:auto;padding:6px 10px 6px 4px;gap:0}
.compact .btns{flex-direction:column;width:auto;gap:8px}
.compact button{flex:0 0 auto;min-width:50px;width:50px;min-height:50px;padding:0;border-radius:14px}
.compact button .t{display:none}
.compact button svg{width:22px;height:22px}
.compact .prog{display:none}
/* 竖屏：底部固定操作栏 */
.port #stage{padding:8px 8px 4px}
.port #bar{background:rgba(255,255,255,.86);border-top:1px solid rgba(203,217,236,.8);box-shadow:0 -6px 18px rgba(33,64,112,.06);padding:8px 12px 10px}
.port button{font-size:15px;min-height:46px;padding:6px 4px}
.port .prog{order:-1}
.port button .t{white-space:nowrap}
</style>
</head>

    </div>
    <div class="prog" id="prog"></div>
  </div>
</div>
